    embed_1: <button type="button" role="tab" aria-selected="true">Kapton</button><button type="button" role="tab" aria-selected="false">PEEK</button><button type="button" role="tab" aria-selected="false">Polycarbonate</button><button type="button" role="tab" aria-selected="false">BoPET</button><button type="button" role="tab" aria-selected="false">Nylon</button><button type="button" role="tab" aria-selected="false">ABS</button>
    heading_3: Kapton
    body_1: <p>A polyimide film developed by DuPont and used in consumer electronics, solar and wind energy, aerospace, automotive, medical devices and biotechnology. It has good insulation and temperature characteristics and comes in many types, sizes and thicknesses. Goodfellow Microfabrication carries Kapton HN and VN on the shelf and can turn around custom parts in as little as 24 hours in some cases.</p>
    heading_4: PEEK
    body_2: <p>Polyether ether ketone is a colourless thermoplastic used in medical, biotech, aerospace and automotive applications. It has high tensile strength, a wide temperature range and strong wear resistance. Goodfellow Microfabrication has extensive experience fabricating precision PEEK parts, such as microfluidic devices and complex automotive parts.</p>
    heading_5: Polycarbonate
    body_3: '<p>One of the most widely used thermoplastics: durable, scratch resistant and inexpensive. Also known as Lexan, Makroclear and Makrolon, it is used in automotive, defence, medical device, biotech, electronics and alternative energy.</p>'
    heading_6: BoPET
    body_4: <p>Biaxially-oriented polyethylene terephthalate is a polyester film used in biotech, electrical and packaging applications. Also known as Hostaphan, Melinex and Mylar, it can be metallised with conductive coatings such as ITO and patterned by Goodfellow Microfabrication.</p>
    heading_7: Nylon
    body_5: <p>Also known as polyamide, nylon is a durable synthetic polymer available in many configurations. Goodfellow Microfabrication has machined precision features in nylon, including blind channels in nylon rods for a medical device application.</p>
    heading_8: ABS
    body_6: <p>Acrylonitrile butadiene styrene is a tough thermoplastic with good heat resistance, used for mechanical parts and components and available in many types and colours. Alongside machining complex ABS parts, Goodfellow Microfabrication can laser mark ABS quickly and cost-effectively.</p>
    body_7: '<p class="aside">Goodfellow Microfabrication stocks a wide range of these polymers. If a material is not in stock, we can source it quickly from our network of qualified suppliers. There is no minimum order quantity. Related: <a href="https://www.potomac-laser.com/?page_id=12394&preview=true" style="font-weight:700">Polymers</a> · <a href="https://www.potomac-laser.com/?page_id=12391&preview=true" style="font-weight:700">Kapton</a></p>'
