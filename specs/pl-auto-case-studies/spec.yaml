    heading_3: Semiconductor
    heading_4: 'Laser micromachining: ramp-up of complex semiconductor part'
    body_3: <p>A Fortune 500 contract manufacturer needed a process for very high aspect ratio channels in a copper substrate, used for chip cooling in high-end computers.</p>
    body_4: <p>Read the case study</p>
    url_2: https://www.potomac-laser.com/about/case-studies/laser-micromachining-ramp-up-of-complex-semiconductor-part/
