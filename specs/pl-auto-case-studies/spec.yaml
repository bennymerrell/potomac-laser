      asset: cs_img_3
    heading_5: Aerospace
    heading_6: Strain gauge circuit to be embedded in fibreglass
    body_5: <p>An airframe research group needed miniature, single-layer electronic circuits that could be embedded in a fibreglass structure without mechanical perturbation.</p>
    body_6: <p>Read the case study</p>
    url_3: https://www.potomac-laser.com/about/case-studies/strain-gauge-circuit-to-be-embedded-in-fiberglass/
    image_4:
      asset: cs_img_4
    heading_7: Medical device
    heading_8: Prototyping at the speed of light
    body_7: <p>A start-up medical device company wanted to shorten prototyping lead times of 6+ weeks caused by fabricating new masks for each design change.</p>
    body_8: <p>Read the case study</p>
    url_4: https://www.potomac-laser.com/about/case-studies/prototyping-at-the-speed-of-light/
