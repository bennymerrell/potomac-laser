    body_1: <p>Our quality management system is certified to <strong>ISO 13485:2016</strong>. These commitments and objectives guide how we work with every customer and supplier.</p>
- pattern: split-list-figure
  tokens:
    heading_1: Our commitments
    heading_2: To achieve these goals, we will
    body_1: <ul><li>Meet all requirements of ISO 13485:2016, along with all applicable statutory and implied national and international standards</li><li>Achieve all of our quality objectives as set out by Management</li><li>Maintain the awareness and competency of our employees</li><li>Continually improve our processes and products while maintaining the safety and efficacy of our devices</li></ul>
