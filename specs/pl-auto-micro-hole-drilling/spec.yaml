- pattern: hero-dark-stat-strip
  tokens:
    body_1: <p>Laser micro-hole drilling is a non-contact process that produces precise, repeatable micro-scale holes in metals, polymers, glass, silicon, and ceramics &mdash; with diameters from <strong>2 µm to 100 µm</strong>, and down to roughly 1 µm depending on material and geometry. Goodfellow Microfabrication matches UV and IR laser sources with micro-CNC drilling for medical, semiconductor, aerospace, and industrial applications.</p>
    body_2: <p><a href="#services">EXPLORE SERVICES →</a></p>
    body_3: <p>Upload STEP, STL, or PDF — our engineers review it for manufacturability.</p>
