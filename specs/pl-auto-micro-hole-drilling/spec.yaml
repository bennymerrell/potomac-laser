- pattern: faq-toggle
  tokens:
    body_1: <p>Direct answers to the engineering, materials, and process questions buyers most often ask when evaluating a microfabrication partner.</p>
    button_1: Ask a Technical Question
    faq_a_1: <p>Laser micro-hole drilling is a non-contact process used to produce precise, repeatable micro-scale holes. It is a core capability at Goodfellow Microfabrication, which drills holes from 2 µm to 100 µm and, depending on material and geometry, down to roughly 1 micron.</p>
    faq_a_2: <p>Goodfellow Microfabrication drills micro-holes from 2 µm to 100 µm and continually develops new processes that push feature sizes smaller, down to about 1 micron. The achievable size depends on the material, thickness, hole shape, and taper.</p>
    faq_a_3: <p>Goodfellow Microfabrication drills polymers including polyimide (Kapton), polycarbonate, PEEK, polyamide (nylon), BoPET (Mylar), polyethylene, ABS, and silicone (PDMS); metals including stainless steel, copper, brass, tantalum, titanium, aluminium, nickel, and nitinol; and other materials such as ceramics, glass, and silicon wafers.</p>
    faq_a_4: <p>The drilling technology depends on the material and application. Transparent polymers are often processed with UV laser sources, while metals and ceramics typically require IR laser systems. For larger features or zero taper, Goodfellow Microfabrication also offers micro-CNC drilling, keeping multiple technologies in-house.</p>
    faq_a_5: <p>Key factors include material thickness, hole diameter, edge quality, hole shape, taper, and the required centre-to-centre spacing between holes. Each parameter directly affects process selection and the achievable result.</p>
    faq_a_6: <p>Yes. Goodfellow Microfabrication's capabilities include multi-axis drilling systems for angled and shaped holes, and high-speed setups designed to drill thousands of holes quickly and repeatably. Supported thicknesses range from ultra-thin films to components several millimetres thick.</p>
    faq_a_7: <p>Yes. Goodfellow Microfabrication provides laser drilling for container closure integrity (CCIT) leak testing, creating micro holes from 2 µm to 100 µm in glass, plastic, and metals. Its ISO 13485:2016 certified processes support high quality and rapid turnaround, often completing projects within a week.</p>
    faq_a_8: <p>Yes. For probe cards, Goodfellow Microfabrication drills holes as small as 2 microns with the tight positional tolerances these applications require, in polymers, ceramics, and other engineered substrates. For catheters, high-precision NIST-traceable Aerotech stages meet tight tolerances on hole diameter and position, including thicker materials for fibre optics of 125 microns and greater.</p>
    faq_q_1: What is laser micro-hole drilling?
