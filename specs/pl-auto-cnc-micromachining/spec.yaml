- pattern: faq-toggle
  tokens:
    body_1: <p>Direct answers to the engineering, materials, and process questions buyers most often ask when evaluating a microfabrication partner.</p>
    button_1: Ask a Technical Question
    faq_a_1: <p>CNC micromachining is a high-precision subtractive manufacturing process used to create features below 1 mm with tolerances measured in microns. Goodfellow Microfabrication uses CNC micromachining for medical, microfluidic, photonic, semiconductor, and electronics parts that need repeatable dimensional accuracy and fine-feature control.</p>
    faq_a_2: <p>Goodfellow Microfabrication holds ±10 µm as standard across metals and engineering plastics. Tighter tolerances may be achievable for specific geometries after DFM review. Final capability depends on the material, feature type, and aspect ratio, which our engineers confirm before production.</p>
    faq_a_3: <p>Yes. Goodfellow Microfabrication machines microfluidic features in PEEK and other high-performance polymers for manifolds, diagnostic cartridges, and lab-on-chip systems. Channel geometry, depth, bonding surfaces, and tolerance stack-up are reviewed during DFM so we can confirm the right CNC or hybrid CNC-laser process before production starts.</p>
    faq_a_4: <p>Goodfellow Microfabrication CNC micromachines metals such as stainless steel, titanium, aluminium, nitinol, and copper; engineering plastics such as PEEK, PMMA, COC, PTFE, and Kapton; and specialty substrates such as silicon, borosilicate glass, and Invar. Materials are sourced through Goodfellow’s wider library of 170,000+ grades, which improves fit, traceability, and sourcing speed.</p>
    faq_a_5: <p>Goodfellow Microfabrication machines CNC features down to roughly 100 µm, with finer detail available through laser or hybrid CNC-laser workflows. Minimum achievable feature size depends on the material, thickness, geometry, and tolerance requirement, so we confirm the right process during DFM review.</p>
    faq_a_6: <p>Use CNC micromachining for structural features, pockets, threads, and deeper cuts above roughly 100 µm. Use laser micromachining for very fine features, thin substrates, or dense hole arrays. Goodfellow Microfabrication combines both when a hybrid process is the best fit, allowing structural geometry and fine features to be produced within one managed workflow.</p>
    faq_a_7: <p>Goodfellow Microfabrication typically responds within 24 hours to new quote and drawing submissions. Once CAD, material, and tolerance requirements are reviewed, the team confirms feasibility, the recommended process path, and the next quoting steps.</p>
    faq_a_8: <p>Yes. You can choose a Goodfellow material, specify form and quantity, and submit it alongside your machining requirement in a single quote request. Material supply is coordinated through Goodfellow Materials and machining through Goodfellow Microfabrication, which keeps procurement simpler and reduces project handoffs.</p>
    faq_q_1: What is CNC micromachining?
    faq_q_2: What tolerances can Goodfellow Microfabrication achieve?
    faq_q_3: Can Goodfellow Microfabrication machine microfluidic channels in PEEK?
    faq_q_4: What materials can Goodfellow Microfabrication CNC micromachine?
