- pattern: hero-dark-stat-strip
  tokens:
    body_1: <p>CNC micromachining is a high-precision subtractive manufacturing process that produces features, holes, channels, and threads at the microscopic scale, with <strong>tolerances held to ±10 µm</strong> and features as small as 100 µm. Goodfellow Microfabrication delivers 4-axis CNC capability combined with laser micromachining for medical, aerospace, photonics, and electronics applications.</p>
    body_2: <p><a href="#services">EXPLORE SERVICES →</a></p>
    body_3: <p>Upload STEP, STL, or PDF, our engineers review it for manufacturability.</p>
    button_1: Upload Drawing / CAD
    button_2: Request Material + Machining Quote
