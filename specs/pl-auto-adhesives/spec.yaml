    heading_1: Laser micromachining
    heading_2: Precise features in adhesive layers
    body_1: <p>Pressure-sensitive adhesives are used across biotech, microfluidics, medical devices, electronics and aerospace. Goodfellow Microfabrication has developed a broad range of technologies to process them, for complex and simple parts on a prototyping or production basis.</p><p>Customers use these materials in applications such as microfluidics and medical devices, to bond layers together. Our laser technology covers cutting, patterning, layering and more.</p>
