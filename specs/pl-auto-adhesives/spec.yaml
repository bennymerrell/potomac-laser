    body_1: <ul class="cards p26"><li><h3>Precision laser cutting</h3><p>Exacting tolerances and detailed designs through laser micromachining.</p></li><li><h3>Rapid turnaround</h3><p>Custom adhesive parts made quickly without compromising quality.</p></li><li><h3>Experience</h3><p>Extensive experience processing a wide variety of pressure-sensitive adhesives.</p></li><li><h3>Custom work</h3><p>We work with you to develop adhesive parts for your application and requirements.</p></li><li><h3>Layer bonding</h3><p>Bonding of different adhesive layers for complex, multi-functional assemblies.</p></li></ul>
