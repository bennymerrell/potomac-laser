    heading_2: Adhesives we process
    body_1: '<p class="pills"><span class="pill">Acrylic adhesives</span><span class="pill">Silicone adhesives</span><span class="pill">Rubber-based adhesives</span><span class="pill">UV-curable adhesives</span><span class="pill">Hot melt adhesives</span><span class="pill">Conductive adhesives</span><span class="pill">Biomedical-grade adhesives</span><span class="pill">Multi-layer adhesive systems</span><span class="pill">Custom formulated adhesives</span><span class="pill">And many more</span></p><p class="note">Precision laser cutting suits biotech and microfluidics, where accuracy and reliability matter: detailed microfluidic channels, multi-layer biomedical devices and precise bonding.</p>'
