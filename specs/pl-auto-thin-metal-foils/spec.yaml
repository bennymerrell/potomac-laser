    heading_2: Applications for thin metal foils
    body_1: <ul class="cards p26"><li><span class="meta">Electronics</span><h3>Electrical components</h3><p>Flexible circuits, EMI/RFI shielding and connectors, using the foils' electrical conductivity and precise tolerances.</p></li><li><span class="meta">Aerospace</span><h3>Aerospace and defence</h3><p>Lightweight, strong foils for sensors, shielding and other components that must perform in extreme conditions.</p></li><li><span class="meta">Medical</span><h3>Medical devices</h3><p>Precision-cut foils for surgical instruments, implants and diagnostic equipment, where biocompatibility and precision matter.</p></li><li><span class="meta">Automotive</span><h3>Automotive</h3><p>Battery components, sensors and fuel cells, improving efficiency and performance.</p></li><li><span class="meta">Energy</span><h3>Energy</h3><p>Solar panels, fuel cells and battery technologies, using the foils' conductive and durable properties.</p></li><li><span class="meta">Industrial</span><h3>Industrial</h3><p>Gaskets, shims and spacers that need precise thickness and durability.</p></li></ul>
