    heading_1: Laser micromachining
    heading_2: Over 30 years machining Kapton
    body_1: <p>Goodfellow Microfabrication has micromachined Kapton polyimide films for over 30 years, fabricating complex and simple parts on a prototyping or production basis. Our technology machines all types of Kapton polyimide, including hole drilling, cutting and more.</p><p>We stock Kapton HN film in 0.001 in, 0.003 in and 0.005 in thicknesses for rapid turnaround on custom prototype parts.</p>
