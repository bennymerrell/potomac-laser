- pattern: hero-dark-centered-meta
  tokens:
    heading_1: About us
    heading_2: The story of Goodfellow Microfabrication
    body_1: <p>Since 1982, Goodfellow Microfabrication has been recognised by commercial and government agencies for contributions to <strong>medical device manufacturing, biotech and electronics fabrication</strong>. Now part of <a href="https://www.goodfellow.com/usa/" target="_blank" rel="noopener">Goodfellow, a leading supplier of advanced materials</a>, we are expanding our capabilities from our facility at the bwtech@UMBC Research and Technology Park in Baltimore, MD.</p>
    heading_3: '1982'
    heading_4: Founded
    heading_5: 5K+
    heading_6: Projects
    heading_7: 100M+
    heading_8: Holes drilled
- pattern: split-media-prose
  tokens:
    image_1:
      asset: about_team_facility
    heading_1: Know the feature
    heading_2: Rapid fabrication of precision devices, from prototyping to full-scale production
    body_1: <p>From a single prototype to production volumes, Goodfellow Microfabrication combines laser micromachining, micro-CNC and 3D printing to help teams move miniature products to market quickly and cost-effectively.</p>
    button_1: Our services
    url_1: https://www.potomac-laser.com/services-applications/
    button_2: Project gallery
    url_2: https://www.potomac-laser.com/project-gallery/
- pattern: icon-cards-3
  tokens:
    heading_1: How we work
    heading_2: History, partnership and group strength
    image_1:
      asset: about_icon_history
    heading_3: Proud history
    body_1: <p>For over 40 years Goodfellow Microfabrication has helped clients develop miniature products and bring them to market quickly and cost-effectively. Since our founding in 1982 we have used a broad range of advanced technologies, from single prototypes to millions of parts, with a focus on precision and quality.</p>
    image_2:
      asset: about_icon_partnership
    heading_4: Long-term partnership
    body_2: <p>We prefer to partner on projects from the first prototypes through to product realisation, not just fabricate parts. That has meant taking on novel materials and production methods, as well as assembly and supply chain management for our partners.</p>
    image_3:
      asset: about_icon_group
    heading_5: Backed by Goodfellow
    body_3: <p>Our integration with <a href="https://www.goodfellow.com/usa" target="_blank" rel="noopener">Goodfellow</a> combines the resources and expertise of both companies. From engineers to support staff, the team works to your project objectives, with micro-manufacturing capability now supported by a global materials supplier.</p>
- pattern: profile-cards-4
  tokens:
    heading_1: Our team
    heading_2: Leadership
    heading_3: Chief Executive Officer
    heading_4: Simon Kenney
    body_1: <p>Before joining Goodfellow, Simon spent 24 years at RS Components in sales, purchasing and product management. In 2010 he moved to Noida, India, on a one-year secondment to an RS joint venture, then led the Emerging Markets and Export team covering countries including Russia, Kazakhstan, Saudi Arabia and Israel.</p><p>Simon joined Goodfellow in 2016 with responsibility for strategic sales growth, sales planning, business development and the sales teams. Following the acquisition of the business by Battery Ventures in September 2021, he moved into the CEO role. He lives in Northamptonshire with his family and supports the Northampton Saints rugby team.</p>
    body_2: <p><a href="https://uk.linkedin.com/in/simon-kenney-6012371/" target="_blank" rel="noopener">LinkedIn profile</a></p>
    image_1:
      asset: about_leader_simon
    heading_5: Chief Financial Officer
    heading_6: Andrew Watson
    body_3: <p>Andrew has held senior finance positions for 15 years, qualifying through industry while studying in the evenings and at weekends. Before joining Goodfellow in 2016 he specialised in turnarounds, as Finance Director for a regional law firm and previously Group Financial Controller for a large motor retail group.</p><p>He is responsible for all financial aspects of the business and, alongside Simon, the creation and delivery of the growth strategy, and line manages the Finance and HR functions. Andrew is a Chartered Management Accountant and lives in Nottinghamshire with his family.</p>
    body_4: <p><a href="https://www.linkedin.com/in/andrew-watson-83a18a15/" target="_blank" rel="noopener">LinkedIn profile</a></p>
    image_2:
      asset: about_leader_andrew
    heading_7: Vice President, Manufacturing
    heading_8: Mike Davis
    body_5: '<p>Mike joined Potomac as a Sales and Marketing Administrator for what was then a fledgling contract manufacturing group. As that business grew, he built the Quality System, became a certified Lead Assessor through the Maryland ISO Consortium, and led Potomac to ISO 9001:2000 certification in January 2004 and ISO 13485:2003 certification a few years later.</p><p>To understand every part of quality, Mike became proficient with Potomac''s laser technologies: assembling production laser systems, creating programs, developing customer applications in R&amp;D and production, and training technicians. He moved into the role of Director of Operations and now leads the upgrade of the facility. Outside work he spends time with his family, plays sport and enjoys the occasional trip to Canada.</p>'
    image_3:
      asset: about_leader_mike
    heading_9: R&amp;D Engineer
    heading_10: Saniya Shetty
    image_4:
      asset: about_leader_saniya
- pattern: stat-cards-6
  tokens:
    heading_1: By the numbers
    heading_2: Four decades of micro-manufacturing
    heading_3: Founded
    heading_4: '1982'
    body_1: <p>Over 40 years in micro-manufacturing technologies.</p>
    heading_5: Projects
    heading_6: 5K+
    body_2: <p>Thousands of projects across medical, biotech, automotive, semiconductor and aerospace.</p>
    heading_7: Holes
    heading_8: 100M+
    body_3: <p>Hundreds of millions of holes drilled, with diameters as small as 1 micron.</p>
    heading_9: Lead time
    heading_10: Rapid
    body_4: <p>Parts turned around in as fast as 24 hours, depending on the application.</p>
    heading_11: Technologies
    heading_12: Expanding
    body_5: <p>Market-driven micro-manufacturing technologies, continually advanced.</p>
    heading_13: Materials
    heading_14: Flexible
    body_6: <p>Processes continually updated to machine new and emerging materials.</p>
