    heading_1: The material
    heading_2: Machining an amorphous solid
    body_1: <p>Glass is an amorphous solid, usually inorganic. Unlike crystalline solids it has no regular internal structure, and it is generally hard and brittle.</p><p>Using high-accuracy motion systems, Goodfellow Microfabrication holds tight positional tolerances across large parts, with line widths as narrow as 10 microns depending on the type of glass.</p><p>We have extensive experience drilling holes for leak testing of pharmaceutical vials and ampoules. See our <a href="https://www.potomac-laser.com/application/leak-test-hole-drilling/" style="font-weight:700">leak test hole drilling</a> capability.</p>
