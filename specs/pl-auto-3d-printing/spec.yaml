- pattern: faq-toggle
  tokens:
    heading_1: FAQ
    heading_2: Common questions
    body_1: <p>Direct answers to the engineering, materials, and process questions buyers most often ask when evaluating a microfabrication partner.</p>
    button_1: Ask a Technical Question
    url_1: /contact/
    faq_q_1: What are Potomac's 3D printing contract services?
    faq_a_1: <p>Potomac provides micro 3D printing contract services spanning product design, prototyping, and small-batch production in biocompatible and advanced materials, as part of a broader advanced-manufacturing offering that moves you from concept to functional parts.</p>
    faq_q_2: When does 3D printing make sense for my part?
    faq_a_2: <p>Potomac helps apply 3D printing where it adds technical and economic value, for complex geometries, part consolidation, and rapid iteration, and advises against it where it does not, helping you avoid costly trial and error.</p>
    faq_q_3: What materials can Potomac 3D print?
    faq_a_3: <p>Materials include engineering plastics (ABS, PLA, nylon), acrylics and specialty polymers, metals, ceramics, and FDA-compliant biocompatible materials. Selection is guided by mechanical performance, thermal stability, chemical resistance, and regulatory requirements.</p>
    faq_q_4: Can you help redesign my part for additive?
    faq_a_4: <p>Yes. Potomac works with your CAD models to optimise geometry for additive processes, re-engineering legacy designs, reducing part count through functional consolidation, and improving performance while lowering material usage and lead time.</p>
    faq_q_5: Can Potomac make micro-scale or complex parts?
    faq_a_5: <p>Yes. Through in-house expertise and a network of qualified additive manufacturing partners, Potomac supports micro- and precision-scale 3D printing of complex geometries and fine features.</p>
    faq_q_6: Do you offer production, not just prototypes?
    faq_a_6: <p>Yes. Services span rapid prototyping and small-batch production, with scale-up support when you are ready to move toward higher volumes.</p>
    faq_q_7: Can 3D printing be combined with other processes?
    faq_a_7: <p>Yes. As a one-stop advanced-manufacturing partner, Potomac combines 3D printing with laser micromachining, micro-CNC, bonding, and inspection, which reduces lead times and simplifies supplier management.</p>
    faq_q_8: Can printed parts be tested and qualified?
    faq_a_8: <p>Yes. Part microstructure, density, surface roughness, and dimensional accuracy can be assessed through Goodfellow's ISO 17025-accredited materials testing division, supporting process validation and component qualification.</p>
