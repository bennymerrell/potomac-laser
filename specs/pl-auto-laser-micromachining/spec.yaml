- pattern: hero-dark-stat-strip
  tokens:
    body_1: <p>Laser micromachining is a non-contact process &mdash; a focused beam removes or modifies material to produce fine features and tight tolerances while minimizing mechanical stress and distortion. Goodfellow Microfabrication machines <strong>metals, polymers, ceramics, and glass</strong>, matching the right laser source &mdash; from deep-UV excimer to Nd:YAG &mdash; to your feature size, tolerance, volume, and material.</p>
    body_2: <p><a href="#services">EXPLORE SERVICES →</a></p>
    body_3: <p>Upload STEP, STL, or PDF — our engineers review it for manufacturability.</p>
    button_1: Upload Drawing / CAD
    button_2: Request a Quote
