- pattern: why-choose-inset-cta
  tokens:
    body_1: <p>Since 1982, Goodfellow Microfabrication has set the standard for laser micromachining &mdash; non-contact, focused-beam machining of metals, polymers, ceramics, and glass for medical, microelectronics, photonics, and microfluidics programs, from prototyping through production.</p>
    body_2: <ul><li><strong>Non-contact precision</strong> &mdash; a focused beam produces fine features and tight tolerances while minimizing mechanical stress and distortion.</li><li><strong>The right laser for the job</strong> &mdash; sources from deep-UV excimer to Nd:YAG, selected per feature size, tolerance, volume, and material.</li><li><strong>CAD-to-FAB, no tooling</strong> &mdash; custom parts without costly masks or hard tooling, keeping prototypes and production cost-effective.</li><li><strong>Metals, polymers, ceramics, glass</strong> &mdash; from stainless steel, copper, and nitinol to Kapton, PEEK, PMMA, and borosilicate.</li><li><strong>Minimal heat-affected zone</strong> &mdash; wavelength matched to the material, with IR for speed and UV for the finest features and thin foils.</li></ul>
    body_3: <p>Upload STEP, STL, or PDF — our engineers review it for manufacturability.<br>No redesign required to start — we’ll help optimise your part.</p>
    button_1: Upload Drawing / CAD
    button_2: Request a Quote
