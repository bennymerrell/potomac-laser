- pattern: faq-toggle
  tokens:
    body_1: <p>Direct answers to the engineering, materials, and process questions buyers most often ask when evaluating a microfabrication partner.</p>
    button_1: Ask a Technical Question
    faq_a_1: <p>Laser micromachining is a precision, non-contact process that uses a focused laser beam to remove or modify material, producing fine features and tight tolerances at the micro scale while minimizing mechanical stress and distortion. Goodfellow Microfabrication has offered laser micromachining since 1982.</p>
    faq_a_2: <p>Goodfellow Microfabrication laser micromachines metals, polymers, ceramics, and glass — including stainless steel, copper, nitinol, tantalum, gold, and aluminium, plus Kapton, Cirlex, PEEK, polystyrene, PMMA, polycarbonate, PTFE, and Mylar.</p>
    faq_a_3: <p>Goodfellow Microfabrication runs a range of laser sources, from deep-UV excimer to Nd:YAG. Engineers select the most appropriate system based on feature size, tolerance, volume, and material; UV systems at 193 nm, 248 nm, and 355 nm are used for the finest features and thin materials.</p>
    faq_a_4: <p>No. Goodfellow Microfabrication's CAD-to-FAB approach eliminates costly masks and tooling, making custom part manufacturing efficient and cost-effective for both prototypes and production parts.</p>
    faq_a_5: <p>For metals, IR lasers are used for quality and cost-effectiveness, with UV lasers for finer features and thin metal thicknesses, achieving minimal heat-affected zones. For polymers, the laser wavelength is matched to the material's absorption spectrum to keep the heat-affected zone minimal.</p>
    faq_a_6: <p>Yes. Goodfellow Microfabrication has developed applications for molds and fixtures that require small features and tight tolerances — for example, laser micromachining a mold for hot embossing, typically in less than a day.</p>
    faq_a_7: <p>Yes. As a core microfabrication technology, laser micromachining is often combined with micro-CNC machining, bonding, and assembly to support both prototyping and production.</p>
    faq_a_8: <p>Laser micromachining is widely used across medical devices, microelectronics, photonics, and microfluidics — and is often paired with micro-CNC, bonding, and assembly.</p>
