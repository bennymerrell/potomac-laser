    heading_9: February 24, 2015
    heading_10: Potomac Photonics Announces FAST TRACK Program to Fabricate Custom Microfluidic Devices
    body_9: <p>FAST TRACK is a manufacturing process to quickly and economically build complete custom microfluidic devices from a CAD drawing.</p>
    body_10: <p>Read the story</p>
    url_5: https://www.potomac-laser.com/news/potomac-photonics-announces-fast-track-program-to-fabricate-custom-microfluidic-devices/
