    heading_7: April 22, 2015
    heading_8: Potomac Photonics Invited to Demo at NASA Technology Day on Capitol Hill
    body_7: <p>Following a number of collaborations with NASA, Potomac was invited to take part in the 2015 NASA Technology Day on the Hill.</p>
    body_8: <p>Read the story</p>
    url_4: https://www.potomac-laser.com/news/potomac-photonics-invited-to-demo-at-nasa-technology-day-on-the-hill/
