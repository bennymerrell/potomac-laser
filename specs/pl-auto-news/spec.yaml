    heading_16: Potomac Awarded $100,000 Maryland Industrial Partnership Grant to Increase Microfluidic Device Production
    body_15: <p>In partnership with UMBC, Potomac was awarded a $100,000 MIPS grant to increase manufacturing capacity for hot embossed microfluidic devices.</p>
