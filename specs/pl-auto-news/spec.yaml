    heading_14: Potomac Serves as Program Chair for Interactive DigiFabCon
    body_13: <p>Potomac served as Program Chair for the annual Digital Fabrication Conference at the Maritime Conference Center in Baltimore.</p>
    body_14: <p>Read the story</p>
    url_7: https://www.potomac-laser.com/news/potomac-serves-program-chair-interactive-digifabcon/
