    heading_12: Excimer Laser Pioneer Adds UV Laser Micromachining Contract Service Capabilities
    body_11: <p>Potomac added ultraviolet lasers from Coherent to its micromachining contract service facility at bwtech@UMBC.</p>
    body_12: <p>Read the story</p>
    url_6: https://www.potomac-laser.com/news/excimer-laser-pioneer-adds-uv-laser-micromachining-contract-service-capabilities/
