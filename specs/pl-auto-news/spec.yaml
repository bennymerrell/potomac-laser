    heading_1: November 8, 2015
    heading_2: Potomac Photonics Honored with Baltimore County New Directions Award
    body_1: <p>Potomac Photonics was selected as one of the 2015 Baltimore County New Directions Award recipients, recognising county companies at the leading edge of engineering and manufacturing.</p>
    body_2: <p>Read the story</p>
