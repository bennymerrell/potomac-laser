    heading_20: Potomac Photonics Micro-3D Prints Map of UMBC 4,000x Smaller than the Campus
    body_19: <p>Using a model generated by aerial robotic photography, Potomac 3D printed a map of the UMBC campus at 1/4,000 of full scale.</p>
