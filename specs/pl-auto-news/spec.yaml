    heading_3: July 27, 2015
    heading_4: Potomac Photonics' Digital Fabrication Brings Iterative Design Process to Asthma Research at Anderson Cancer Center
    body_3: <p>CAD-based laser micromachining gave a research team at the University of Texas MD Anderson Cancer Center a quick, economical way to test and change designs.</p>
    body_4: <p>Read the story</p>
    url_2: https://www.potomac-laser.com/news/potomac-photonics-digital-fabrication-brings-iterative-design-process-to-asthma-research-at-anderson-cancer-center/
