      asset: news_img_3
    heading_5: May 27, 2015
    heading_6: Potomac's Rapid Prototyping of Custom Microfluidic Devices Featured in Commercial Micro Manufacturing Magazine
    body_5: <p>The UK magazine featured Potomac's rapid prototyping programme for custom microfluidic devices, using micromilling, laser micromachining and hot embossing replication.</p>
    body_6: <p>Read the story</p>
    url_3: https://www.potomac-laser.com/news/potomacs-rapid-prototyping-of-custom-microfluidic-devices-featured-in-commercial-micro-manufacturing-magazine/
