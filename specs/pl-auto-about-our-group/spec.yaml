    body_1: <p>A global leader in the supply of high-quality advanced materials, serving science and industry for over 75 years.</p>
    body_2: <p>With a vast range of over 170,000 products, including metals, alloys, ceramics, polymers and compounds, Goodfellow is dedicated to driving innovation and solving technical challenges. Our commitment to excellence is reflected in extensive product offerings and a customer-focused approach, making us a trusted partner for researchers and engineers worldwide.</p>
    body_3: <p><strong>170,000+</strong> materials</p>
    body_4: <p><strong>75+</strong> years</p>
    body_5: <p><strong>ISO 9001</strong> quality assured</p>
    button_1: Visit Goodfellow →
    url_1: https://www.goodfellow.com/
    image_2:
      asset: group_logo_microfab
    heading_4: Since 1982
    heading_5: Microfabrication
    heading_6: Goodfellow Microfabrication
    body_6: <p>One of the US leaders in microfabrication and digital manufacturing, rapid prototyping through full-scale production of precision devices.</p>
    body_7: <p>Since 1982, the Baltimore-based Goodfellow Microfabrication team (formerly Potomac Photonics) has been at the forefront of innovation in medical-device manufacturing, biotech and electronics fabrication. By leveraging advanced laser and CNC technologies, the team delivers high-quality, cost-effective solutions that carry your project from concept to market.</p>
    body_8: <p><strong>±10 µm</strong> tolerances</p>
    body_9: <p><strong>40+</strong> years</p>
    body_10: <p><strong>Prototype → production</strong></p>
    button_2: Explore microfabrication →
    url_2: https://www.potomac-laser.com/?post_type=post_services&p=12239&preview=true
    image_3:
      asset: group_logo_stp
    heading_7: Swiss labs
    heading_8: Analytics &amp; Materials
    heading_9: Suisse Technology Partners
    body_11: <p>A Swiss competence centre for material-based solutions and analytics, ensuring safe and innovative products for industrial customers.</p>
    body_12: <p>STP provides specialised services in materials and surface technology. Their expertise spans technical safety, chemical analytics and packaging development, supported by certified and accredited laboratories. An interdisciplinary approach drives progress and innovation across every engagement.</p>
    body_13: <p><strong>Accredited</strong> laboratories</p>
    body_14: <p><strong>Surface</strong> technology</p>
    body_15: <p><strong>Failure</strong> investigation</p>
    button_3: Visit Suisse TP →
    url_3: https://suisse-tp.ch/
    image_4:
      asset: group_logo_bas
    heading_10: Since 1935
    heading_11: Reference Materials
    heading_12: The Bureau of Analysed Samples
    body_16: <p>A renowned provider of Certified Reference Materials (CRMs) for chemical and spectroscopic analysis.</p>
    body_17: <p>Established in 1935, BAS continues the legacy of the British Chemical Standards movement, offering a wide range of materials for the iron and steel industry. Their CRMs are essential for ensuring accuracy and reliability in laboratory testing, making BAS a trusted partner for quality assurance across many industries.</p>
    body_18: <p><strong>Since 1935</strong></p>
