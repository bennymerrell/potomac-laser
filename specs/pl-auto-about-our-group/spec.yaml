    body_1: <p>We deliver high-quality scientific materials and services across a wide range of industries and applications. Together, Goodfellow, Goodfellow Microfabrication, Suisse Technology Partners and the Bureau of Analysed Samples, we drive innovation from concept to market, becoming your one-stop shop for scientific and industrial material needs.</p>
