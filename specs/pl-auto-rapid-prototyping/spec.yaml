- pattern: faq-toggle
  tokens:
    heading_1: FAQ
    heading_2: Common questions
    body_1: <p>Direct answers to the engineering, materials, and process questions buyers most often ask when evaluating a microfabrication partner.</p>
    button_1: Ask a Technical Question
    url_1: /contact/
    faq_q_1: What is rapid prototyping?
    faq_a_1: <p>Rapid prototyping lets engineers and product developers move from concept to functional parts in days rather than months. Potomac delivers high-precision rapid prototyping using laser micromachining, micro-CNC, micro 3D printing, and bonding and assembly.</p>
    faq_q_2: How fast can I get a prototype?
    faq_a_2: <p>Turnaround is typically within two weeks, and as fast as 24 hours in select cases depending on material type and thickness. This supports fast iteration and functional validation.</p>
    faq_q_3: What fabrication technologies does Potomac use?
    faq_a_3: <p>Potomac brings laser micromachining, micro-CNC machining, micro 3D printing, and bonding and assembly together under one roof, so projects move quickly without switching suppliers.</p>
    faq_q_4: How fine can laser-prototyped features be?
    faq_a_4: <p>Laser micromachining achieves feature sizes as small as 2 µm and tolerances down to ±1 µm, with minimal heat-affected zones and clean edge quality, including cutting, drilling, ablation, and surface structuring.</p>
    faq_q_5: What materials can be used for prototypes?
    faq_a_5: '<p>Prototypes can be made in the same materials intended for production: metals such as stainless steel, aluminium, titanium, nickel alloys, and thin foils; polymers such as PMMA, polycarbonate, polyimide, and COC/COP; and glass, silicon, and technical ceramics.</p>'
    faq_q_6: Can Potomac 3D print complex or microfluidic parts?
    faq_a_6: <p>Yes. Micro 3D printing enables fast production of complex geometries that are difficult to machine, including microfluidic structures, diagnostic and biomedical components, and fixtures, housings, and functional test parts.</p>
    faq_q_7: Does rapid prototyping lower cost and risk?
    faq_a_7: <p>Yes. By removing the need for hard tooling, molds, or photomasks, rapid prototyping reduces upfront cost, lets teams evaluate designs early and often, and uncovers design, material, or manufacturability issues before production scale-up.</p>
    faq_q_8: Which industries does Potomac serve?
    faq_a_8: <p>Potomac's rapid prototyping services are used across aerospace, automotive, biotechnology, medical devices, pharmaceutical manufacturing, semiconductor and microelectronics, and electronics and photonics.</p>
