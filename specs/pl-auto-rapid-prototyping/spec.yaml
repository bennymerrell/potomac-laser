    heading_2: Why choose Goodfellow Microfabrication for rapid prototyping
    body_1: <p>We deliver high-precision rapid prototyping for advanced manufacturing, turning concepts into functional, production-grade parts in days, with multiple fabrication technologies and material flexibility under one roof.</p>
    body_2: <ul><li><strong>Micron-level precision</strong>, fine features and tight tolerances on functional, production-grade prototypes.</li><li><strong>Fast, reliable turnaround</strong>, typically within two weeks, and as fast as 24 hours in select cases.</li><li><strong>Integrated fabrication</strong>, laser, micro-CNC, micro 3D printing, and bonding &amp; assembly under one roof.</li><li><strong>Broad material choice</strong>, prototype in the same metals, polymers, glass, silicon, and ceramics intended for production.</li><li><strong>A clear path to production</strong>, regulated-industry experience and a smooth transition from prototype to scale-up.</li></ul>
